<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{min-height:100vh}.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{padding:28px 18px;border-right:1px solid #2e2f3d;background:#15161e}.brand{font-size:22px;font-weight:750;margin-bottom:28px}.nav button{width:100%;text-align:left;margin:4px 0;background:transparent}.nav button.active{background:#333044}.content{padding:30px;overflow:auto}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.item{padding:14px;border-radius:13px;background:#292a38;border-left:5px solid var(--item-color,#8174ee)}h1{margin:0 0 6px}h2{font-size:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .full{grid-column:1/-1}.form label{font-size:12px;color:#b6b1c8}.check{width:auto}.summary{font-size:32px;font-weight:750}.task.done{opacity:.55;text-decoration:line-through}.code{font-size:42px;letter-spacing:8px;font-weight:800}.online{color:#8fe0af}.offline{color:#e7a3ad}
</style></head><body><div class="layout"><aside class="side"><div class="brand">✦ 家庭節奏</div><div class="nav"><button data-page="home" class="active">今天</button><button data-page="tasks">自主責任表</button><button data-page="reminders">提醒設定</button><button data-page="family">家庭連線</button><button data-page="settings">使用時間與家長鎖</button></div></aside><main class="content">
<section id="home" class="page active"><h1>今天</h1><p class="muted">把日子照顧好，一件一件來。</p><div class="grid"><div class="card"><div class="muted">剩餘使用時間</div><div id="summary-time" class="summary">--</div><div id="summary-used" class="muted"></div></div><div class="card"><div class="muted">責任完成度</div><div id="summary-tasks" class="summary">--</div><div id="summary-reward" class="muted"></div></div></div><h2>今天的責任</h2><div id="today-tasks" class="grid"></div></section>
<section id="tasks" class="page"><div class="row spread"><div><h1>自主責任表</h1><p class="muted">完成一次、獎勵一次，不會重複領取。</p></div><button class="primary" id="add-task">新增任務</button></div><div id="task-list" class="grid"></div><div id="task-form" class="card" hidden><h2>任務內容</h2><div class="form"><input id="task-title" class="full" placeholder="例如：洗餐具"><label>交給誰<select id="task-target"></select></label><label>類型<select id="task-kind"><option value="daily">每天</option><option value="weekly">每週指定日</option><option value="once">單次</option></select></label><label>日期<input id="task-date" type="date"></label><label>星期（0 日～6 六）<input id="task-weekdays" placeholder="例如 1,3,5"></label><label>時間獎勵（分鐘）<input id="task-reward" type="number" min="0" value="0"></label><button id="task-save" class="primary full">儲存任務</button></div></div></section>
<section id="reminders" class="page"><div class="row spread"><div><h1>提醒</h1><p class="muted">每個提醒都有自己的聲音和顏色。</p></div><button class="primary" id="add-reminder">新增提醒</button></div><div id="reminder-list" class="grid"></div><div id="reminder-form" class="card" hidden><h2>提醒內容</h2><div class="form"><input id="rem-title" class="full" placeholder="例如：眼睛休息一下"><label>提醒誰<select id="rem-target"></select></label><label>計時方式<select id="rem-trigger"><option value="clock">固定時刻</option><option value="afterStart">開始使用後</option></select></label><div id="rem-clock-fields" class="form full"><label>時間<input id="rem-time" type="time"></label><label>重複<select id="rem-repeat"><option value="daily">每天</option><option value="weekly">每週指定日</option><option value="once">單次</option></select></label><label>日期<input id="rem-date" type="date"></label><label>星期（0 日～6 六）<input id="rem-weekdays" placeholder="例如 1,3,5"></label></div><div id="rem-relative-fields" class="form full" hidden><label>實際使用多久後（分鐘）<input id="rem-delay" type="number" min="1" value="20"></label><label class="row"><input class="check" id="rem-relative-repeat" type="checkbox">每隔相同時間重複提醒</label></div><label>類型<select id="rem-type"><option value="gentle">中間提醒</option><option value="shutdown">關機提醒</option><option value="task">任務提醒</option></select></label><label>視窗顏色<input id="rem-color" type="color" value="#7c6df2"></label><label>音效<select id="rem-sound"><option value="chime">清脆鈴聲</option><option value="water">水滴聲</option><option value="soft">柔和提示</option><option value="alarm">關機警示</option></select></label><div class="sound-actions full"><button type="button" id="rem-sound-preview">▶ 試聽</button><button type="button" id="rem-sound-custom">選擇自己的音效</button><span id="rem-sound-file" class="muted">可使用 MP3、WAV、OGG、M4A（最多 5 MB）</span></div><button id="rem-save" class="primary full">儲存提醒</button></div></div></section>
<section id="family" class="page"><h1>家庭連線</h1><p class="muted">所有裝置必須連在同一個家中網路。</p><div id="family-local" class="grid"><div class="card"><h2>建立家庭</h2><input id="create-family-name" placeholder="家庭名稱" value="我們家"><input id="create-device-name" placeholder="這台裝置的名稱"><button id="create-family" class="primary">建立並成為主要電腦</button></div><div class="card"><h2>加入家庭</h2><input id="join-device-name" placeholder="這台裝置的名稱"><input id="join-host" placeholder="主要電腦 IP，例如 192.168.1.20"><input id="join-code" inputmode="numeric" maxlength="6" placeholder="六位配對碼"><button id="join-family" class="primary">加入家庭</button></div></div><div id="family-connected" hidden><div class="card"><div class="row spread"><div><div id="family-name" class="summary"></div><div id="family-role" class="muted"></div></div><span id="family-online" class="pill"></span></div><div id="host-info"></div><label id="managed-consent" class="row" hidden><input class="check" id="allow-management" type="checkbox">允許主要電腦查看並管理這台裝置的時間設定、提醒與責任表</label><button id="sync-family">立即同步</button><button id="leave-family" class="danger">離開家庭</button></div><h2>家庭裝置</h2><div id="peer-list" class="grid"></div><div id="managed-area" hidden><h2>受管理裝置</h2><div id="managed-device-list" class="grid"></div><div id="managed-editor" class="card" hidden><div class="row spread"><h2 id="managed-title">裝置設定</h2><span id="managed-sync-state" class="pill"></span></div><div class="form"><label class="full row"><input class="check" id="remote-enabled" type="checkbox">啟用這台裝置的使用時間管理</label><label>計算方式<select id="remote-mode"><option value="quota">只看每日額度</option><option value="clock">只看固定關機時間</option><option value="both">額度與固定時間並用</option></select></label><label>每日額度（分鐘）<input id="remote-limit" type="number" min="0"></label><label>固定關機時間<input id="remote-time" type="time"></label><label>獎勵上限（分鐘）<input id="remote-cap" type="number" min="0"></label><label>關機寬限（分鐘）<input id="remote-grace" type="number" min="1"></label><label class="row"><input class="check" id="remote-extend" type="checkbox">獎勵可延後固定時間</label><button id="remote-save" class="primary full">儲存並等待孩子電腦同步</button></div><h2>目前提醒</h2><div id="remote-reminders" class="grid"></div><h2>目前責任項目</h2><div id="remote-tasks" class="grid"></div></div></div></div><div id="family-error" class="offline"></div></section>
<section id="settings" class="page"><h1>使用時間與家長鎖</h1><div class="card"><div class="form"><label class="full row"><input class="check" id="set-start-windows" type="checkbox">Windows 開機時自動啟動家庭節奏</label><label class="full row"><input class="check" id="set-time-enabled" type="checkbox">啟用這台電腦的使用時間管理</label><div id="time-control-fields" class="form full"><label>時間計算方式<select id="set-time-mode"><option value="quota">只看每日額度</option><option value="clock">只看固定關機時間</option><option value="both">額度與固定時間並用（先到者生效）</option></select></label><label id="limit-field">每日基本時間（分鐘）<input id="set-limit" type="number" min="0"></label><label id="clock-field">每日關機時間<input id="set-shutdown-time" type="time"></label><label id="extend-field" class="row"><input class="check" id="set-extend-clock" type="checkbox">任務獎勵也延後固定關機時間</label><label>每日獎勵上限（分鐘）<input id="set-cap" type="number" min="0"></label><label>關機寬限（分鐘）<input id="set-grace" type="number" min="1"></label><label class="full row"><input class="check" id="set-simulate" type="checkbox">安全測試模式（倒數結束不真的關機）</label></div><label>設定家長密碼<input id="set-password" type="password" autocomplete="new-password" placeholder="留白代表不修改"></label><button id="settings-save" class="primary full">儲存設定</button></div></div><div id="cancel-card" class="card" hidden><h2>取消本次關機</h2><div class="row"><input id="cancel-password" type="password" autocomplete="current-password" placeholder="輸入家長密碼"><button id="cancel-shutdown">取消關機</button></div><p class="muted">此欄位只會在關機倒數進行中顯示。</p></div></section>
</main></div><script src="dashboard.js"></script></body></html>
