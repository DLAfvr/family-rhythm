<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="common.css"><style>
body{min-height:100vh;background:#15161e}.shell{max-width:1020px;margin:auto;padding:24px}.top{position:sticky;top:0;z-index:5;padding:12px 0;background:#15161ef2}.top h1{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.grid+.card{margin-top:16px}.summary{font-size:30px;font-weight:750}.online{color:#8fe0af}.offline{color:#e7a3ad}details{margin:16px 0;border:1px solid #363747;border-radius:14px;background:#20212c}summary{cursor:pointer;padding:17px 20px;font-size:18px;font-weight:700;list-style:none}summary::after{content:'＋';float:right;color:#aca4ec}details[open] summary::after{content:'－'}details .inside{padding:0 20px 20px}.inside>.toolbar+div,.inside>#tasks,.inside>#reminders{margin-top:14px}.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.form>.full,.full{grid-column:1/-1}.form label{display:flex;flex-direction:column;gap:7px;min-width:0}.form label.inline{flex-direction:row;align-items:center;justify-content:flex-start;gap:11px;min-height:38px}.form label.inline .check{order:0}.form input:not([type=checkbox]):not([type=color]),.form select{width:100%;box-sizing:border-box}.stats-list{display:grid;gap:8px}.stats-row{padding:10px 12px;background:#292a38;border-radius:10px}.item{padding:13px;border-radius:12px;background:#292a38;margin:8px 0}.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar>button,.actions>button,.top>button{white-space:nowrap}.editor{margin:12px 0;padding:16px;border:1px solid #45475c;border-radius:13px;background:#191a23}.editor h3{margin-top:0}.subsection{margin-top:18px;padding-top:16px;border-top:1px solid #383a4b}.hint{font-size:13px}.danger-link{color:#ffb4bd}.vacation-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.conditional-off{opacity:.56}.weekday-custom[hidden],.conditional[hidden],.editor[hidden]{display:none!important}@media(max-width:720px){.shell{padding:14px}.form{grid-template-columns:1fr}.form>.full,.full{grid-column:auto}.top{align-items:flex-start}.top button{max-width:145px}}
</style></head><body><main class="shell">
<div class="top row spread"><div><h1 id="title">家庭管理</h1><div id="sync" class="muted"></div></div><button id="save-all" class="primary">儲存設定</button></div>
<div class="grid"><div class="card"><div class="muted">剩餘使用時間</div><div id="remaining" class="summary">--</div></div><div class="card"><div class="muted">時間晶幣</div><div id="balance" class="summary">--</div></div></div>
<div class="card"><div class="toolbar"><label>統計日期 <input id="date" type="date"></label><button id="reset" class="danger">重置今日使用時間</button></div><h2>責任統計</h2><div id="stats"></div></div>

<details id="usage-section"><summary>使用時間設定</summary><div class="inside form">
  <label class="inline full"><input class="check" id="enabled" type="checkbox">啟用使用時間管理</label>
  <label>計算方式<select id="mode"><option value="quota">只看每日額度</option><option value="clock">只看固定關機時間</option><option value="both">額度與固定時間並用</option></select></label>
  <label>每日額度（分鐘）<input id="limit" type="number" min="0"></label>
  <label class="inline"><input class="check" id="earliest-enabled" type="checkbox">限制最早開始時間</label><label>最早開始時間<input id="earliest" type="time"></label>
  <label>固定關機時間<input id="shutdown" type="time"></label><div></div>
  <label class="inline full"><input class="check" id="day-type-enabled" type="checkbox">平日與假日使用不同設定</label>
  <div id="day-type-fields" class="form full conditional"><label>平日額度（分鐘）<input id="weekday-limit" type="number" min="0"></label><label>假日額度（分鐘）<input id="weekend-limit" type="number" min="0"></label><label>平日關機時間（週日～週四晚）<input id="weekday-time" type="time"></label><label>假日關機時間（週五、週六晚）<input id="weekend-time" type="time"></label></div>
  <label>關機寬限（分鐘）<input id="grace" type="number" min="1"></label><label>晶幣持有上限（分鐘）<input id="reward-cap" type="number" min="0"></label>
  <label class="inline"><input class="check" id="extend-clock" type="checkbox">晶幣可延長關機時間</label><label>關機最多延長（分鐘）<input id="extension" type="number" min="0"></label>
  <div class="full subsection"><h3>寒暑假與假期區間</h3><p class="muted hint">可設定完整日期，或只填月日讓它每年重複；跨年區間也可以。</p><div id="vacation-list"></div>
    <div class="editor form"><label>名稱<input id="vac-name" placeholder="例如：暑假"></label><label class="inline"><input class="check" id="vac-annual" type="checkbox">每年重複（只填月日）</label><label>開始日期<input id="vac-start" type="date"></label><label>結束日期<input id="vac-end" type="date"></label><label>每日額度（分鐘）<input id="vac-limit" type="number" min="0"></label><label>關機時間<input id="vac-time" type="time"></label><div class="actions full"><button id="vac-save" type="button">加入假期區間</button><button id="vac-cancel" type="button" hidden>取消編輯</button></div></div>
  </div>
</div></details>

<details id="task-section"><summary>責任項目</summary><div class="inside"><div class="toolbar"><button id="task-add" class="primary">新增責任</button><button id="task-paste">貼上責任內容</button></div>
  <div id="task-editor" class="editor" hidden><h3 id="task-editor-title">新增責任</h3><div class="form"><label class="full">責任內容<input id="task-title" placeholder="例如：洗餐具"></label><label>類型<select id="task-kind"><option value="once">單次</option><option value="daily">每天</option><option value="weekly">每週指定日</option><option value="bounty">懸賞</option></select></label><label class="inline"><input class="check" id="task-enabled" type="checkbox" checked>啟用</label><label id="task-date-label">日期<input id="task-date" type="date"></label><label id="task-weekday-label">星期<select id="task-weekday-mode"><option value="weekday">平日（一～五）</option><option value="weekend">假日（六、日）</option><option value="custom">自訂</option></select></label><label id="task-weekdays-label" class="weekday-custom">自訂星期（0 日～6 六）<input id="task-weekdays" placeholder="例如 1,3,5"></label><label>時間晶幣獎勵（分鐘）<input id="task-reward" type="number" min="0" value="0"></label><label id="task-max-label">懸賞完成人數<input id="task-max" type="number" min="1" value="1"></label><label class="inline"><input class="check" id="task-reset-custom" type="checkbox">自訂換日時間</label><label id="task-reset-label">換日時間<input id="task-reset" type="time" value="00:00"></label><div class="actions full"><button id="task-save" class="primary">儲存責任</button><button id="task-cancel">取消</button></div></div></div><div id="tasks"></div>
</div></details>

<details id="reminder-section"><summary>提醒設定</summary><div class="inside"><div class="toolbar"><button id="reminder-add" class="primary">新增提醒</button><button id="reminder-paste">貼上提醒內容</button></div>
  <div id="reminder-editor" class="editor" hidden><h3 id="reminder-editor-title">新增提醒</h3><div class="form"><label class="full">提醒內容<input id="rem-title" placeholder="例如：眼睛休息一下"></label><label>計時方式<select id="rem-trigger"><option value="clock">固定時刻</option><option value="afterStart">開始使用後</option></select></label><label class="inline"><input class="check" id="rem-enabled" type="checkbox" checked>啟用</label><div id="rem-clock" class="form full"><label>時間<input id="rem-time" type="time"></label><label>重複<select id="rem-repeat"><option value="daily">每天</option><option value="weekly">每週指定日</option><option value="once">單次</option></select></label><label id="rem-date-label">日期<input id="rem-date" type="date"></label><label id="rem-weekday-label">星期<select id="rem-weekday-mode"><option value="weekday">平日（一～五）</option><option value="weekend">假日（六、日）</option><option value="custom">自訂</option></select></label><label id="rem-weekdays-label" class="weekday-custom">自訂星期（0 日～6 六）<input id="rem-weekdays" placeholder="例如 1,3,5"></label></div><div id="rem-relative" class="form full" hidden><label>開始使用後（分鐘）<input id="rem-delay" type="number" min="1" value="20"></label><label class="inline"><input class="check" id="rem-relative-repeat" type="checkbox">每隔相同時間再次提醒</label></div><label>類型<select id="rem-type"><option value="gentle">中間提醒</option><option value="shutdown">關機提醒</option><option value="task">任務提醒</option></select></label><label>視窗顏色<input id="rem-color" type="color" value="#7c6df2"></label><label>音效<select id="rem-sound"><option value="chime">清脆鈴聲</option><option value="water">水滴聲</option><option value="soft">柔和提示</option><option value="alarm">關機警示</option></select></label><div class="actions full"><button type="button" id="rem-preview">▶ 試聽</button><button type="button" id="rem-custom">選擇自己的音效</button><span id="rem-sound-file" class="muted">可使用 MP3、WAV、OGG、M4A（最多 5 MB）</span></div><div class="actions full"><button id="rem-save" class="primary">儲存提醒</button><button id="rem-cancel">取消</button></div></div></div><div id="reminders"></div>
</div></details>

<details><summary>家長鎖與裝置安全</summary><div class="inside"><p id="lock-state"></p><button id="request-lock" class="danger">要求恢復家長鎖</button><p id="lock-feedback" class="muted"></p></div></details>
</main><script src="management.js"></script></body></html>
