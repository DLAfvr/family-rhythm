<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--reminder,#6e61df)}.veil{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#ffffff25,transparent 48%),#11131a55}.box{z-index:1;width:min(680px,80vw);text-align:center;padding:60px;border-radius:30px;background:#171822e8;border:1px solid #ffffff30;box-shadow:0 25px 100px #0008}.icon{font-size:70px}.title{font-size:52px;margin:12px 0}.message{font-size:21px;color:#d8d4e2;margin-bottom:32px}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.box button{font-size:20px;padding:14px 36px;background:white;color:#252332}.box button.task-mode{background:linear-gradient(135deg,#ffe89a,#8ef0ff 45%,#8b78ff);color:#151526;font-weight:700}
</style></head><body><div class="veil"></div><main class="box"><div id="icon" class="icon">✦</div><h1 id="title" class="title">提醒時間</h1><div id="message" class="message"></div><div class="actions"><button id="task-mode" class="task-mode" hidden>進入任務模式</button><button id="ack">我知道了</button></div></main><script src="reminder.js"></script></body></html>
