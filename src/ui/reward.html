<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>body{display:grid;place-items:center;min-height:100vh;background:radial-gradient(circle,#302947,#111219 65%)}main{width:min(560px,90vw);text-align:center;padding:34px}.crystal{width:66px;height:76px;margin:0 auto 12px;clip-path:polygon(50% 0,88% 25%,76% 78%,50% 100%,24% 78%,12% 25%);background:linear-gradient(135deg,#fff8b7 3%,#8ef0ff 20%,#8b78ff 58%,#432b91 100%);filter:drop-shadow(0 0 18px #8d79ff99);position:relative}.crystal:after{content:'';position:absolute;inset:9px 22px 26px 13px;background:#fff9;clip-path:polygon(50% 0,100% 30%,45% 100%,0 28%)}.amount{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin:24px 0}.amount label{text-align:left}.amount span{padding-bottom:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style></head><body><main class="card"><div class="crystal"></div><h1 id="title">使用獎勵時間</h1><p id="message" class="muted"></p><p>時間晶幣餘額：<b id="balance"></b> 分鐘</p><div class="amount"><label>這次要使用幾分鐘<input id="minutes" type="number" min="1"></label><span>分鐘</span></div><div class="actions"><button id="decline">現在不用，準備關機</button><button id="use" class="primary">使用時間晶幣</button></div></main><script src="reward.js"></script></body></html>
