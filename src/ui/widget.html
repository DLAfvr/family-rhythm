<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
html, body { width:100%; height:100%; overflow:hidden; }
body { background:transparent; padding:8px; user-select:none; }
.widget { -webkit-app-region:drag; height:100%; padding:17px; border-radius:22px; background:linear-gradient(145deg,rgba(42,40,60,.97),rgba(22,23,32,.98)); border:1px solid #ffffff18; box-shadow:0 14px 45px #0008; }
button { -webkit-app-region:no-drag; }.time { font-size:38px; font-weight:750; letter-spacing:-2px; }.head { font-size:13px; color:#bbb6cf; }.wallet{display:flex;align-items:center;gap:9px;margin-top:4px;color:#e9e4ff}.crystal-coin{width:23px;height:27px;clip-path:polygon(50% 0,90% 27%,76% 78%,50% 100%,24% 78%,10% 27%);background:linear-gradient(135deg,#fff6a4,#7ee8ff 30%,#8b70ff 67%,#4b2d98);filter:drop-shadow(0 0 7px #9e82ffcc);position:relative}.crystal-coin:after{content:'';position:absolute;inset:4px 8px 10px 5px;background:#fff9;clip-path:polygon(50% 0,100% 30%,45% 100%,0 28%)}
.next { margin-top:13px; padding:10px; background:#ffffff09; border-radius:12px; font-size:13px; }.actions { margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
</style></head><body><main class="widget"><div class="row spread"><span class="head">家庭節奏 · 今天</span><span id="status" class="pill">本機</span></div><div id="time" class="time">-- 分鐘</div><div class="wallet"><span class="crystal-coin"></span><span id="reward">時間晶幣 -- 分鐘</span></div><div class="next"><b>下一個提醒</b><div id="next" class="muted">尚未設定</div></div><div class="actions"><button id="tasks">責任表</button><button class="primary" id="manage">管理設定</button></div></main><script src="widget.js"></script></body></html>
